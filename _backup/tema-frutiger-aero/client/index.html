<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helmet DL</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- Fundo do Helmet Desk (tema Frutiger Aero), em formato retrato:
         céu violeta, aurora desfocada, raios de luz, bokeh e estrelas. -->
    <div class="backdrop" aria-hidden="true">
        <svg viewBox="0 0 400 1000" preserveAspectRatio="xMidYMid slice">
            <defs>
                <linearGradient id="bd-sky" x1="0" y1="0" x2="0.3" y2="1">
                    <stop offset="0" stop-color="#06020E"/>
                    <stop offset="0.4" stop-color="#0F0624"/>
                    <stop offset="0.75" stop-color="#1E0C40"/>
                    <stop offset="1" stop-color="#2E1360"/>
                </linearGradient>
                <linearGradient id="bd-a1" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#6F3CBC"/>
                    <stop offset="0.5" stop-color="#A982E6"/>
                    <stop offset="1" stop-color="#E58CC9"/>
                </linearGradient>
                <linearGradient id="bd-a2" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#E58CC9"/>
                    <stop offset="0.55" stop-color="#8950D9"/>
                    <stop offset="1" stop-color="#48CAE4"/>
                </linearGradient>
                <filter id="bd-blur" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="26"/>
                </filter>
                <radialGradient id="bd-orb-lilac" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.3">
                    <stop offset="0" stop-color="#E4D6F9" stop-opacity="0.25"/>
                    <stop offset="0.85" stop-color="#A982E6" stop-opacity="0.05"/>
                    <stop offset="1" stop-color="#C9AEF2" stop-opacity="0.30"/>
                </radialGradient>
                <radialGradient id="bd-orb-white" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.3">
                    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
                    <stop offset="0.85" stop-color="#A982E6" stop-opacity="0.05"/>
                    <stop offset="1" stop-color="#C9AEF2" stop-opacity="0.35"/>
                </radialGradient>
                <radialGradient id="bd-orb-magenta" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.3">
                    <stop offset="0" stop-color="#E58CC9" stop-opacity="0.20"/>
                    <stop offset="0.85" stop-color="#E58CC9" stop-opacity="0.04"/>
                    <stop offset="1" stop-color="#E58CC9" stop-opacity="0.25"/>
                </radialGradient>
                <radialGradient id="bd-orb-aqua" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.3">
                    <stop offset="0" stop-color="#48CAE4" stop-opacity="0.25"/>
                    <stop offset="0.85" stop-color="#48CAE4" stop-opacity="0.04"/>
                    <stop offset="1" stop-color="#48CAE4" stop-opacity="0.35"/>
                </radialGradient>
            </defs>
            <rect width="400" height="1000" fill="url(#bd-sky)"/>
            <!-- aurora: faixas largas e desfocadas, que se movem bem devagar -->
            <g class="aurora" filter="url(#bd-blur)">
                <path opacity="0.7" fill="url(#bd-a1)" d="M-80,700 C40,600 180,760 330,640 S470,560 520,590 L520,680 C430,650 360,740 250,760 S80,720 -80,820 Z"/>
                <path opacity="0.5" fill="url(#bd-a2)" d="M-80,290 C60,220 190,380 320,280 S470,220 520,240 L520,320 C420,330 340,420 230,430 S60,350 -80,420 Z"/>
                <path opacity="0.45" fill="#48CAE4" d="M20,930 C140,880 260,950 440,870 L440,910 C260,990 140,930 20,985 Z"/>
                <ellipse cx="360" cy="-10" rx="170" ry="120" opacity="0.35" fill="#6F3CBC"/>
            </g>
            <!-- raios de luz, bokeh e estrelas (nítidos) -->
            <path stroke="#E4D6F9" stroke-opacity="0.4" stroke-width="1.5" fill="none" d="M-20,800 C120,640 260,600 420,330"/>
            <path stroke="#E4D6F9" stroke-opacity="0.2" stroke-width="1" fill="none" d="M-20,840 C130,690 280,660 420,400"/>
            <path stroke="#48CAE4" stroke-opacity="0.2" stroke-width="2.5" fill="none" d="M-20,900 C150,760 300,740 420,500"/>
            <circle cx="330" cy="610" r="48" fill="url(#bd-orb-lilac)"/>
            <circle cx="285" cy="705" r="22" fill="url(#bd-orb-white)"/>
            <circle cx="48" cy="170" r="36" fill="url(#bd-orb-magenta)"/>
            <circle cx="378" cy="455" r="14" fill="url(#bd-orb-white)"/>
            <circle cx="180" cy="905" r="30" fill="url(#bd-orb-aqua)"/>
            <circle cx="105" cy="70" r="1.5" fill="#FFFFFF" fill-opacity="0.8"/>
            <circle cx="175" cy="140" r="1" fill="#FFFFFF" fill-opacity="0.6"/>
            <circle cx="240" cy="60" r="1.5" fill="#E4D6F9" fill-opacity="0.7"/>
            <circle cx="295" cy="180" r="1" fill="#FFFFFF" fill-opacity="0.6"/>
            <circle cx="345" cy="110" r="1.5" fill="#FFFFFF" fill-opacity="0.8"/>
            <circle cx="65" cy="300" r="1" fill="#FFFFFF" fill-opacity="0.5"/>
            <circle cx="385" cy="260" r="1" fill="#FFFFFF" fill-opacity="0.6"/>
            <circle cx="20" cy="520" r="1.5" fill="#48CAE4" fill-opacity="0.5"/>
            <circle cx="140" cy="480" r="1" fill="#FFFFFF" fill-opacity="0.4"/>
            <circle cx="372" cy="80" r="10" fill="#E4D6F9" fill-opacity="0.2"/>
        </svg>
    </div>

    <!-- Ícones (Lucide, traço 2px), reaproveitados com <use> -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
            <symbol id="i-paste" viewBox="0 0 24 24"><path d="M15 2H9a1 1 0 0 0-1 1v2c0 .6.4 1 1 1h6c.6 0 1-.4 1-1V3c0-.6-.4-1-1-1Z"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/><path d="M11 14h10"/><path d="m17 10 4 4-4 4"/></symbol>
            <symbol id="i-folder" viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></symbol>
            <symbol id="i-film" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></symbol>
            <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M2 14h4"/><path d="M10 8h4"/><path d="M18 16h4"/></symbol>
            <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/></symbol>
            <symbol id="i-package" viewBox="0 0 24 24"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="m7.5 4.27 9 5.15"/></symbol>
            <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
            <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
            <symbol id="i-retry" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
            <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
            <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></symbol>
            <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
        </defs>
    </svg>

    <header class="app-header">
        <div class="brand">
            <img class="brand-logo" src="img/logo.png" alt="" />
            <div class="brand-text">
                <h1>Helmet DL</h1>
                <p id="projectInfo" class="sub-info" title="Clique para atualizar">Verificando projeto…</p>
            </div>
        </div>
        <button id="btnOpenFolder" class="icon-btn" title="Abrir a pasta Helmet DL do projeto">
            <svg class="icon"><use href="#i-folder"/></svg>
        </button>
    </header>

    <main class="content">
        <!-- Link -->
        <section class="card">
            <div class="card-title"><svg class="icon"><use href="#i-link"/></svg>Link do vídeo</div>
            <div class="url-row">
                <div class="url-box">
                    <input type="text" id="urlInput" class="input url-input" placeholder="Cole o link do YouTube, TikTok, X, Instagram…" spellcheck="false" autocomplete="off" />
                    <button id="btnPaste" class="icon-btn sm ghost" title="Colar da área de transferência"><svg class="icon"><use href="#i-paste"/></svg></button>
                </div>
                <button id="btnDownload" class="btn btn-primary"><svg class="icon"><use href="#i-download"/></svg>Download</button>
            </div>

            <div id="preview" class="preview" style="display:none">
                <div class="thumb"><img id="previewThumb" alt="" /><span id="previewDuration" class="badge"></span></div>
                <div class="preview-text">
                    <div id="previewTitle" class="preview-title"></div>
                    <div id="previewMeta" class="preview-meta"></div>
                </div>
            </div>
            <p id="previewNote" class="hint" style="display:none"></p>
            <div id="status" class="status" role="status"></div>
        </section>

        <!-- Formato -->
        <section class="card">
            <div class="card-title"><svg class="icon"><use href="#i-film"/></svg>Formato</div>

            <div class="group-label">Baixar</div>
            <div class="segmented">
                <label><input type="radio" name="content" value="both" checked /><span>Vídeo + áudio</span></label>
                <label><input type="radio" name="content" value="video" /><span>Só vídeo</span></label>
                <label><input type="radio" name="content" value="audio" /><span>Só áudio</span></label>
            </div>

            <div id="videoOptions">
                <div class="inline-field">
                    <label for="qualitySelect">Qualidade</label>
                    <select id="qualitySelect" class="input">
                        <option value="best">Original (máxima)</option>
                        <option value="4320">8K (4320p)</option>
                        <option value="2160">4K (2160p)</option>
                        <option value="1440">2K (1440p)</option>
                        <option value="1080" selected>Full HD (1080p)</option>
                        <option value="720">HD (720p)</option>
                        <option value="480">480p</option>
                        <option value="360">360p</option>
                        <option value="240">240p</option>
                        <option value="144">144p</option>
                    </select>
                </div>

                <div class="group-label">Processamento</div>
                <div class="segmented">
                    <label><input type="radio" name="mode" value="original" /><span>Original</span></label>
                    <label><input type="radio" name="mode" value="remux" checked /><span>Remux</span></label>
                    <label><input type="radio" name="mode" value="reencode" /><span>Reencode</span></label>
                    <label><input type="radio" name="mode" value="both" /><span>Ambos</span></label>
                </div>
                <p id="modeHint" class="hint"></p>

                <div class="inline-field" id="containerRow">
                    <label for="containerSelect">Container do remux</label>
                    <select id="containerSelect" class="input">
                        <option value="mp4" selected>MP4</option>
                        <option value="mov">MOV</option>
                        <option value="mkv">MKV</option>
                    </select>
                </div>
                <div class="inline-field" id="codecRow">
                    <label for="codecSelect">Codec do reencode</label>
                    <select id="codecSelect" class="input">
                        <option value="h264" selected>H.264 (MP4)</option>
                        <option value="h265">H.265 / HEVC (MP4)</option>
                        <option value="prores">ProRes 422 (MOV)</option>
                    </select>
                </div>
                <div class="inline-field" id="encoderRow">
                    <span>Reencodar usando</span>
                    <div class="segmented compact">
                        <label><input type="radio" name="encoder" value="cpu" checked /><span>CPU</span></label>
                        <label><input type="radio" name="encoder" value="gpu" /><span>GPU</span></label>
                    </div>
                </div>
                <p id="encoderHint" class="hint" style="display:none"></p>

                <label class="switch-row">
                    <span class="switch-text">Priorizar formatos do Premiere
                        <small>Prefere H.264 + AAC quando o site oferece</small></span>
                    <span class="switch"><input type="checkbox" id="compatCheckbox" checked /><span class="slider-ui"></span></span>
                </label>
            </div>

            <div id="audioOptions" style="display:none">
                <div class="inline-field">
                    <label for="audioFormatSelect">Formato do áudio</label>
                    <select id="audioFormatSelect" class="input">
                        <option value="wav" selected>WAV</option>
                        <option value="mp3">MP3 (320k)</option>
                        <option value="m4a">M4A / AAC</option>
                        <option value="best">Original (sem converter)</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Opções -->
        <section class="card">
            <div class="card-title"><svg class="icon"><use href="#i-sliders"/></svg>Opções</div>
            <label class="switch-row first">
                <span class="switch-text">Importar numa bin "Helmet DL"
                    <small>Desligado: vai direto para a raiz do Project</small></span>
                <span class="switch"><input type="checkbox" id="binCheckbox" checked /><span class="slider-ui"></span></span>
            </label>
            <label class="switch-row">
                <span class="switch-text">Baixar a playlist inteira
                    <small>Quando o link fizer parte de uma playlist</small></span>
                <span class="switch"><input type="checkbox" id="playlistCheckbox" /><span class="slider-ui"></span></span>
            </label>
            <label class="switch-row">
                <span class="switch-text">Baixar só um trecho
                    <small>Economiza tempo em vídeos e lives longas</small></span>
                <span class="switch"><input type="checkbox" id="trimCheckbox" /><span class="slider-ui"></span></span>
            </label>
            <div id="trimRow" class="two-col trim-row" style="display:none">
                <div class="mini-field"><label for="trimStart">Início</label><input type="text" id="trimStart" class="input" placeholder="00:00:00" /></div>
                <div class="mini-field"><label for="trimEnd">Fim</label><input type="text" id="trimEnd" class="input" placeholder="00:01:30" /></div>
            </div>
            <div class="inline-field">
                <label for="cookiesSelect" title="Necessário para Instagram, vídeos privados ou com restrição de idade">Cookies do navegador</label>
                <select id="cookiesSelect" class="input">
                    <option value="" selected>Nenhum</option>
                    <option value="firefox">Firefox</option>
                    <option value="chrome">Chrome</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="opera">Opera</option>
                    <option value="vivaldi">Vivaldi</option>
                </select>
            </div>
        </section>

        <!-- Fila -->
        <section class="card">
            <div class="card-title">
                <svg class="icon"><use href="#i-list"/></svg>Downloads
                <button id="btnClearDone" class="icon-btn sm push-right" title="Limpar concluídos da lista"><svg class="icon"><use href="#i-trash"/></svg></button>
            </div>
            <ul id="queue" class="queue"></ul>
        </section>

        <!-- Ferramentas -->
        <details class="card log-card" id="toolsDetails">
            <summary><svg class="icon"><use href="#i-package"/></svg>Ferramentas<span class="version" id="toolsSummary">verificando…</span></summary>
            <div class="tools">
                <div class="tool-row" data-tool="ytdlp">
                    <span class="dot"></span>
                    <div class="tool-text"><b>yt-dlp</b><small id="ytdlpInfo">—</small></div>
                    <button class="btn btn-secondary btn-sm" id="btnYtdlp">Instalar</button>
                </div>
                <div class="tool-row" data-tool="ffmpeg">
                    <span class="dot"></span>
                    <div class="tool-text"><b>FFmpeg</b><small id="ffmpegInfo">—</small></div>
                    <button class="btn btn-secondary btn-sm" id="btnFfmpeg">Instalar</button>
                </div>
                <div class="tool-row" data-tool="deno">
                    <span class="dot"></span>
                    <div class="tool-text"><b>Deno</b><small id="denoInfo">—</small></div>
                    <button class="btn btn-secondary btn-sm" id="btnDeno">Instalar</button>
                </div>
                <label class="switch-row">
                    <span class="switch-text">Atualizar o yt-dlp sozinho
                        <small>Confere uma vez por dia; os sites mudam com frequência</small></span>
                    <span class="switch"><input type="checkbox" id="autoUpdateCheckbox" checked /><span class="slider-ui"></span></span>
                </label>
                <p class="hint">O Deno é usado pelo yt-dlp para ler o YouTube. As ferramentas ficam em <span id="binDirNote" class="path"></span></p>
            </div>
        </details>

        <!-- Log -->
        <details class="card log-card" id="logDetails">
            <summary><svg class="icon"><use href="#i-terminal"/></svg>Log<span class="version" id="versionNote"></span></summary>
            <div id="log" class="log"></div>
        </details>
    </main>

    <script src="js/CSInterface.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/downloader.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
